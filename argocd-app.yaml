apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-ssr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nisha760/react-ssr.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true