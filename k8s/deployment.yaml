apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-ssr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-ssr
  template:
    metadata:
      labels:
        app: react-ssr
    spec:
      containers:
        - name: react-ssr
          image: react-ssr:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000